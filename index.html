<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 신조어</title>
<meta name="description" content="매일 하나, 새로운 신조어를 뜻·유래·예문과 함께 알려드립니다.">
<meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 신조어">
<style>
  :root {
    --bg: #f4ecdc;
    --paper: #fbf6ea;
    --ink: #1d1a16;
    --muted: #7a6f60;
    --line: #dccfb6;
    --accent: #d8432b;
    --accent-ink: #ffffff;
    --chip: #ead9b8;
    --shadow: 0 1px 0 rgba(0,0,0,.04), 0 12px 32px -16px rgba(80,50,10,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16130f;
      --paper: #211c16;
      --ink: #f3eadb;
      --muted: #a89c88;
      --line: #3a3126;
      --accent: #ff7a5c;
      --accent-ink: #1d0f0a;
      --chip: #3a2f21;
      --shadow: 0 1px 0 rgba(255,255,255,.03), 0 12px 32px -16px rgba(0,0,0,.7);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 4px 18px; }
  header h1 { font-size: 14px; letter-spacing: .08em; margin: 0; font-weight: 700; color: var(--muted); }
  header time { font-size: 13px; color: var(--muted); }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .hero { padding: 34px 26px 26px; position: relative; }
  .hero::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: var(--accent);
  }
  .chip {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
    background: var(--chip); color: var(--ink);
  }
  .word {
    font-family: 'Noto Serif KR', 'Nanum Myeongjo', 'Batang', 'Apple Myungjo', serif;
    font-size: clamp(40px, 13vw, 58px);
    line-height: 1.15; font-weight: 900; margin: 16px 0 4px; letter-spacing: -.02em;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .meaning { font-size: 18px; margin: 10px 0 0; font-weight: 600; word-break: keep-all; }
  .sections { border-top: 1px dashed var(--line); }
  .sec { padding: 18px 26px; }
  .sec + .sec { border-top: 1px dashed var(--line); }
  .sec h2 { font-size: 12px; letter-spacing: .1em; color: var(--muted); margin: 0 0 6px; font-weight: 700; }
  .sec p { margin: 0; font-size: 15.5px; word-break: keep-all; }
  .example {
    background: var(--bg); border-radius: 14px; padding: 12px 14px; border-left: 4px solid var(--accent);
  }
  .note { font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 10px; padding: 18px 26px 24px; }
  button, .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700; font-size: 15px;
    padding: 12px 16px; border-radius: 14px; flex: 1; text-align: center; text-decoration: none;
  }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:active { transform: translateY(1px); }
  footer { margin: 18px 6px 0; font-size: 12.5px; color: var(--muted); text-align: center; }
  footer a { color: inherit; }
  #toast {
    position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { padding: 40px 26px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>오늘의 신조어</h1>
    <time id="date"></time>
  </header>
  <article class="card" id="card" aria-live="polite">
    <div class="empty">불러오는 중…</div>
  </article>
  <footer id="foot"></footer>
</main>
<div id="toast" role="status"></div>

<script>
(function () {
  var TZ = 'Asia/Seoul';

  // 한국 시간 기준 오늘 날짜 (YYYY-MM-DD)
  function todayKST() {
    return new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(new Date());
  }
  function prettyDate(s) {
    var p = s.split('-').map(Number);
    var d = new Date(Date.UTC(p[0], p[1] - 1, p[2], 12));
    return new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'UTC', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    }).format(d);
  }
  function dayNumber(s) {
    var p = s.split('-').map(Number);
    return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
  }

  // 오늘 날짜로 등록된 단어가 있으면 그것을, 없으면 기본 단어 목록에서 날짜 순환으로 고릅니다.
  function pick(words, today) {
    var exact = words.filter(function (w) { return w.date === today; })[0];
    if (exact) return exact;
    var pool = words.filter(function (w) { return !w.date; });
    var list = pool.length ? pool : words;
    return list[dayNumber(today) % list.length];
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function section(title, bodyNode) {
    var s = el('div', 'sec');
    s.appendChild(el('h2', null, title));
    s.appendChild(bodyNode);
    return s;
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._h); toast._h = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  function render(w, today) {
    var card = document.getElementById('card');
    card.textContent = '';

    var hero = el('div', 'hero');
    if (w.category) hero.appendChild(el('span', 'chip', w.category));
    hero.appendChild(el('div', 'word', w.word));
    hero.appendChild(el('p', 'meaning', w.meaning));
    card.appendChild(hero);

    var secs = el('div', 'sections');
    if (w.example) {
      var p = el('p', 'example', w.example);
      secs.appendChild(section('이렇게 써요', p));
    }
    if (w.origin) secs.appendChild(section('어디서 왔을까', el('p', null, w.origin)));
    if (w.note) secs.appendChild(section('참고', el('p', 'note', w.note)));
    card.appendChild(secs);

    var actions = el('div', 'actions');
    var copy = el('button', 'primary', '복사·공유');
    copy.type = 'button';
    copy.addEventListener('click', function () {
      var text = '오늘의 신조어 「' + w.word + '」\n' + w.meaning + (w.example ? '\n예) ' + w.example : '');
      if (navigator.share) {
        navigator.share({ title: '오늘의 신조어', text: text }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(function () { toast('복사했어요'); });
      } else {
        toast('이 브라우저에서는 복사를 지원하지 않아요');
      }
    });
    actions.appendChild(copy);
    if (w.source && /^https:\/\//.test(w.source)) {
      var a = el('a', 'btn ghost', '출처 보기');
      a.href = w.source; a.target = '_blank'; a.rel = 'noopener noreferrer';
      actions.appendChild(a);
    }
    card.appendChild(actions);
  }

  function boot() {
    var today = todayKST();
    document.getElementById('date').textContent = prettyDate(today);
    fetch('words.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        var words = data.words || [];
        if (!words.length) throw new Error('empty');
        render(pick(words, today), today);
        var f = document.getElementById('foot');
        f.textContent = '신조어는 웹 검색과 AI 요약으로 정리돼요. 뜻은 커뮤니티마다 다를 수 있어요.';
      })
      .catch(function () {
        var card = document.getElementById('card');
        card.textContent = '';
        card.appendChild(el('div', 'empty', '단어를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.'));
      });
  }
  boot();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
