<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>오늘의 신조어</title>
<meta name="description" content="매일 새로운 신조어를 뜻·유래·예문·반대어·유사어와 함께 알려드립니다.">
<meta name="theme-color" content="#2b2c36">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 신조어">
<link rel="preload" href="fonts/MonaS10x12.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Mona12-Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* ── 글꼴: Mona (SIL OFL 1.1, fonts/OFL-NOTICE.txt 참고) ── */
  @font-face { font-family: 'Mona12B';  src: url('fonts/Mona12-Bold.woff2')  format('woff2'); font-display: block; }
  @font-face { font-family: 'Mona10B';  src: url('fonts/Mona10-Bold.woff2')  format('woff2'); font-display: block; }
  @font-face { font-family: 'MonaS10';  src: url('fonts/MonaS10x12.woff2')   format('woff2'); font-display: block; }
  @font-face { font-family: 'MonaS8';   src: url('fonts/MonaS8x12.woff2')    format('woff2'); font-display: block; }

  /* ── 색상: 첫 번째 참고 이미지에서 추출 ── */
  :root {
    --page:   #2b2c36;
    --body:   #bfbcb8;   /* 본체 */
    --body-hi:#d3d1cd;
    --body-lo:#a6a39e;
    --strip:  #bbb9b5;   /* 상단 띠 */
    --bezel:  #575762;   /* 화면 테두리 */
    --scr-a:  #425213;   /* 화면 위쪽 */
    --scr-b:  #526417;   /* 화면 아래쪽 */
    --btn:    #7f0946;   /* 빨간 버튼 */
    --dpad:   #0b0c18;   /* 십자키 */
    --dome:   #1b1e29;
    --pill:   #706f77;   /* 회색 버튼 */
    --pink:   #651b4f;
    --navy:   #0f0a47;
    --label:  #272f70;   /* 파란 글자 */
    --ink:    #0b0c18;
    /* 화면 안 글자·강조색: 화면 초록에서 밝기만 바꾼 색 */
    --deep:   #2f3b0d;
    --mid:    #8a9f3a;
    --pale:   #c9d983;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
  body {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(10px, env(safe-area-inset-top)) 4px max(10px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-synthesis: none;
  }
  #fit { width: calc(394px * var(--s, 1)); height: calc(634px * var(--s, 1)); }
  #device {
    position: relative; width: 394px; height: 634px;
    transform: scale(var(--s, 1)); transform-origin: 0 0;
    background: var(--body); border-radius: 8px 8px 72px 12px;
    box-shadow: inset 2px 2px 0 var(--body-hi), inset -2px -3px 0 var(--body-lo), 0 0 0 1px #0004;
    text-rendering: optimizeSpeed; font-kerning: none;
  }
  .abs { position: absolute; }

  /* 상단 띠 */
  #strip { left: 0; top: 0; width: 394px; height: 34px; background: var(--strip); border-radius: 8px 8px 0 0;
           box-shadow: inset 0 -1px 0 var(--body-lo), inset 0 1px 0 var(--body-hi); }
  #strip i { position: absolute; top: 11px; left: 22px; width: 44px; height: 10px; border-radius: 5px; background: var(--body-lo);
             box-shadow: inset 0 1px 0 #0003; }
  #strip i::after { content: ""; position: absolute; top: 1px; left: 3px; width: 14px; height: 8px; border-radius: 4px; background: var(--body-hi); }

  /* 화면 테두리 */
  #bezel { left: 53px; top: 53px; width: 294px; height: 297px; background: var(--bezel); border-radius: 8px 8px 36px 8px;
           box-shadow: inset 0 1px 0 #7a7a86, inset 0 -1px 0 #3f3f49; }
  .stripe { position: absolute; height: 1px; }
  .stripe.p { background: var(--pink); } .stripe.n { background: var(--navy); }
  #bz-text { position: absolute; left: 85px; top: 3px; width: 124px; text-align: center; font: 12px/14px 'MonaS8', monospace; color: #b8b8b6; white-space: nowrap; }
  #led { position: absolute; left: 9px; top: 279px; width: 5px; height: 5px; border-radius: 50%; background: #3a0d24; box-shadow: 0 0 0 1px #0004; }
  #led.on { background: #d41f6f; box-shadow: 0 0 3px 1px #d41f6f88; }
  #led-t { position: absolute; left: 20px; top: 275px; font: 12px/12px 'MonaS8', monospace; color: #b8b8b6; }

  /* ── 게임 화면 (250×250, 이전보다 1.2배) ── */
  #screen { position: absolute; left: 22px; top: 23px; width: 250px; height: 250px; overflow: hidden;
            background: linear-gradient(var(--scr-a), var(--scr-b)); outline: 1px solid var(--ink);
            box-shadow: 0 0 0 3px #46464f, 0 0 0 4px #0006; color: var(--pale); }
  #world { position: absolute; left: 0; top: 0; width: 750px; height: 750px; transform: translate(-250px, -250px); }
  #world.anim { transition: transform .26s steps(9, end); }
  .panel { position: absolute; width: 250px; height: 250px; }
  .panel[data-p="c"] { left: 250px; top: 250px; } .panel[data-p="u"] { left: 250px; top: 0; }
  .panel[data-p="d"] { left: 250px; top: 500px; } .panel[data-p="l"] { left: 0; top: 250px; }
  .panel[data-p="r"] { left: 500px; top: 250px; }
  .pb { position: absolute; left: 8px; right: 8px; top: 21px; bottom: 6px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
        -webkit-user-select: none; scrollbar-width: thin; scrollbar-color: var(--pale) transparent; }
  .pb::-webkit-scrollbar { width: 4px; } .pb::-webkit-scrollbar-thumb { background: var(--pale); } .pb::-webkit-scrollbar-track { background: #0b0c1844; }
  .pb.foot { bottom: 20px; }
  .inner { will-change: transform; }
  .txt { margin: 0; font: 24px/28px 'MonaS10', 'Noto Sans KR', sans-serif; color: var(--pale); word-break: keep-all; overflow-wrap: anywhere; }
    .cat { display: inline-block; font: 10px/10px 'Mona10B', sans-serif; color: var(--ink); background: var(--pale); border: 1px solid var(--ink);
         padding: 1px 4px; border-radius: 2px; box-shadow: inset 0 -1px 0 var(--mid); }
  .word { margin: 5px 0 6px; font: 36px/40px 'Mona12B', sans-serif; color: #eef6c4; text-shadow: 1px 1px 0 var(--ink); word-break: keep-all; overflow-wrap: anywhere; }
  .word.sm { font-size: 18px; line-height: 21px; margin: 7px 0 7px; }
  .bubble { border: 1px solid var(--pale); border-radius: 3px; padding: 5px 6px; background: #0b0c1822; box-shadow: 2px 2px 0 var(--ink); }
  .pfoot { position: absolute; left: 8px; right: 8px; bottom: 5px; font: 12px/12px 'MonaS8', monospace; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rel + .rel { margin-top: 7px; }
  .rel b { font: 36px/40px 'Mona12B', sans-serif; word-break: keep-all; overflow-wrap: anywhere; color: #eef6c4; text-shadow: 1px 1px 0 var(--ink); }
  .rel b.sm { font-size: 18px; line-height: 21px; }
  .rel .tg { margin-left: 4px; font: 10px/10px 'Mona10B', sans-serif; color: var(--ink); background: var(--mid); padding: 0 3px; border-radius: 2px; }
  .rel .txt { margin-top: 2px; }
  .empty { text-align: center; padding-top: 18px; }
  .empty .txt { margin-top: 8px; color: var(--mid); }
  .sp { image-rendering: pixelated; display: block; position: absolute; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* HUD */
  #hud { position: absolute; left: 4px; right: 4px; top: 3px; height: 14px; display: none; }
  #hearts { position: absolute; left: 0; top: 3px; display: flex; gap: 2px; }
  #hearts canvas { position: static; }
  #label { position: absolute; right: 0; top: 0; min-width: 40px; text-align: center; font: 10px/10px 'Mona10B', sans-serif; color: var(--ink);
           background: var(--pale); border: 1px solid var(--ink); border-radius: 3px; padding: 1px 5px; box-shadow: inset 0 -1px 0 var(--mid), 1px 1px 0 var(--ink); }

  /* 시작 화면 */
  #title { position: absolute; inset: 0; background: var(--scr-a) url('assets/title-bg.png') 0 0 / 250px 250px no-repeat; image-rendering: pixelated; }
  #t1 { position: absolute; left: 6px; top: 6px; background: #0b0c18b8; padding: 3px 6px 2px; font: 24px/26px 'Mona12B', sans-serif; color: #eef6c4; text-shadow: 1px 1px 0 var(--ink), 2px 2px 0 var(--ink); }
  #t2 { position: absolute; left: 6px; top: 70px; background: #0b0c18b8; padding: 2px 5px; font: 12px/12px 'MonaS8', monospace; color: var(--pale); text-shadow: 1px 1px 0 var(--ink); }
  #t3 { position: absolute; left: 0; right: 0; top: 218px; height: 22px; background: #0b0c18c8; text-align: center; font: 12px/22px 'MonaS10', sans-serif; color: var(--pale); }

  /* 라벨 */
  #brand { left: 51px; top: 360px; font: 24px/26px 'Mona12B', sans-serif; color: var(--label); white-space: nowrap; transform: scale(.7); transform-origin: 0 0; }

  /* 십자키 */
  #dpad { left: 52px; top: 417px; width: 76px; height: 76px; }
  #dpad .shape { position: absolute; inset: 0; transition: transform .05s; }
  #dpad .shape::before, #dpad .shape::after { content: ""; position: absolute; background: var(--dpad); border-radius: 4px;
       box-shadow: inset 1px 1px 0 #2a2d3a, inset -1px -1px 0 #000; }
  #dpad .shape::before { left: 0; top: 25px; width: 76px; height: 26px; }
  #dpad .shape::after  { left: 25px; top: 0; width: 26px; height: 76px; }
  #dpad .dome { position: absolute; left: 29px; top: 29px; width: 18px; height: 18px; border-radius: 50%; background: var(--dome); z-index: 1;
                box-shadow: inset 1px 1px 0 #3c3f48; }
  #dpad.pu .shape { transform: perspective(120px) rotateX(8deg); } #dpad.pd .shape { transform: perspective(120px) rotateX(-8deg); }
  #dpad.pl .shape { transform: perspective(120px) rotateY(-8deg); } #dpad.pr .shape { transform: perspective(120px) rotateY(8deg); }
  #dpad .bc { left: 29px; top: 29px; width: 18px; height: 18px; border-radius: 50%; z-index: 3; }
  #dpad button { position: absolute; width: 26px; height: 26px; margin: 0; padding: 0; border: 0; background: transparent; cursor: pointer; z-index: 2; }
  #dpad .bu { left: 25px; top: 0; height: 28px; } #dpad .bd { left: 25px; top: 48px; height: 28px; }
  #dpad .bl { left: 0; top: 25px; width: 28px; } #dpad .br { left: 48px; top: 25px; width: 28px; }
  #dpad button:focus-visible { outline: 2px solid #d41f6f; }
  #dpad i { position: absolute; width: 0; height: 0; border: 4px solid transparent; z-index: 1; pointer-events: none; }
  #dpad .iu { left: 34px; top: 6px; border-bottom: 5px solid #3c3f48; border-top: 0; }
  #dpad .id { left: 34px; top: 64px; border-top: 5px solid #3c3f48; border-bottom: 0; }
  #dpad .il { left: 6px; top: 34px; border-right: 5px solid #3c3f48; border-left: 0; }
  #dpad .ir { left: 64px; top: 34px; border-left: 5px solid #3c3f48; border-right: 0; }

  /* 빨간 버튼 (B, A) */
  .rb { position: absolute; width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
        background: radial-gradient(circle at 38% 34%, #a02461 0, var(--btn) 55%, #650737 100%);
        box-shadow: 0 2px 0 #0005, inset -1px -2px 0 #0004; }
  .rb:active, .rb.press { transform: translateY(2px); box-shadow: 0 0 0 #0005, inset -1px -2px 0 #0004; }
  .rb:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #bB { left: 262px; top: 443px; } #bA { left: 311px; top: 420px; }
  .rl { position: absolute; font: 10px/10px 'Mona10B', sans-serif; color: var(--label); }

  /* 회색 버튼: SHARE(카드 JPG 공유), MEMO(메모장) */
  .gb { position: absolute; width: 36px; height: 14px; border-radius: 7px; border: 0; padding: 0; cursor: pointer; transform: rotate(-25deg);
        background: var(--pill); box-shadow: inset 0 1px 0 #8d8c94, inset 0 -2px 0 #55545c, 0 1px 0 #0003; }
  .gb:active { transform: rotate(-25deg) translateY(1px); box-shadow: inset 0 1px 0 #55545c; }
  #bSel { left: 140px; top: 520px; } #bSta { left: 191px; top: 520px; }
  .gl { position: absolute; font: 12px/12px 'MonaS8', monospace; color: var(--label); transform: rotate(-25deg); white-space: nowrap; }

  /* 스피커 홈 */
  #spk { left: 258px; top: 522px; width: 100px; height: 90px; }
  #spk i { position: absolute; top: 0; width: 5px; height: 46px; border-radius: 3px; background: var(--body-lo); transform: rotate(30deg);
           box-shadow: 1px 1px 0 var(--body-hi), inset 1px 1px 0 #0003; }

  /* 메모장 */
  #mta { touch-action: pan-y; }
  #memo { position: absolute; inset: 0; display: none; z-index: 5; background: linear-gradient(var(--scr-a), var(--scr-b)); }
  #memo.open { display: block; }
  #memo .mh { position: absolute; left: 4px; right: 4px; top: 3px; height: 14px; }
  #mtag { position: absolute; left: 0; top: 0; font: 10px/10px 'Mona10B', sans-serif; color: var(--ink); background: var(--pale); border: 1px solid var(--ink); border-radius: 3px; padding: 1px 5px; box-shadow: inset 0 -1px 0 var(--mid), 1px 1px 0 var(--ink); }
  #mst { position: absolute; right: 2px; top: 2px; font: 12px/12px 'MonaS8', monospace; color: var(--mid); }
  #mta { position: absolute; left: 6px; right: 6px; top: 24px; bottom: 6px; width: auto; height: auto; resize: none; margin: 0; padding: 5px 6px;
         border: 1px solid var(--pale); border-radius: 3px; background: #0b0c1833; box-shadow: 2px 2px 0 var(--ink); color: #eef6c4;
         font: 24px/28px 'MonaS10', 'Noto Sans KR', sans-serif; caret-color: var(--pale); outline: none; -webkit-user-select: text; user-select: text; }
  #mta::placeholder { color: var(--mid); }
  #toast { position: absolute; left: 10px; right: 10px; bottom: 8px; z-index: 6; display: none; text-align: center; font: 12px/14px 'MonaS10', 'Noto Sans KR', sans-serif;
           color: var(--pale); background: #0b0c18; border: 1px solid var(--pale); border-radius: 3px; padding: 3px 4px; }
  #note { margin: 10px 8px 0; max-width: 394px; text-align: center; font: 12px/16px 'MonaS10', 'Noto Sans KR', sans-serif; color: #9a9ba6; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { #world.anim { transition: none; } .blink { animation: none; } }
</style>
</head>
<body>
<div id="fit">
  <div id="device">
    <div id="strip" class="abs"><i></i></div>

    <div id="bezel" class="abs">
      <span class="stripe p" style="left:12px;top:8px;width:66px"></span><span class="stripe n" style="left:12px;top:13px;width:66px"></span>
      <div id="bz-text">PIXEL SLANG DISPLAY</div>
      <span class="stripe p" style="left:255px;top:8px;width:29px"></span><span class="stripe n" style="left:255px;top:13px;width:29px"></span>
      <div id="led"></div><div id="led-t">PWR</div>

      <div id="screen" role="img" aria-label="신조어 게임 화면">
        <div id="world">
          <div class="panel" data-p="c"></div><div class="panel" data-p="u"></div><div class="panel" data-p="d"></div>
          <div class="panel" data-p="l"></div><div class="panel" data-p="r"></div>
        </div>
        <div id="hud"><div id="hearts"></div><div id="label">뜻</div></div>
        <div id="memo"><div class="mh"><div id="mtag">MEMO</div><div id="mst">자동 저장</div></div>
          <textarea id="mta" maxlength="4000" spellcheck="false" placeholder="여기에 적으면 자동으로 저장돼요." aria-label="메모장"></textarea></div>
        <div id="toast" role="status"></div>
        <div id="title">
          <div id="t1">오늘의<br>신조어</div>
          <div id="t2"></div>
          <div id="t3" class="blink">B · A 버튼을 눌러요</div>
        </div>
      </div>
    </div>

    <div id="brand" class="abs">오늘의 신조어</div>

    <div id="dpad" class="abs">
      <div class="shape"></div><div class="dome"></div>
      <i class="iu"></i><i class="id"></i><i class="il"></i><i class="ir"></i>
      <button class="bc" id="bHome" aria-label="가운데 버튼: 홈 화면으로"></button>
      <button class="bu" data-dir="up"    aria-label="위쪽: 유래"></button>
      <button class="bd" data-dir="down"  aria-label="아래쪽: 예문"></button>
      <button class="bl" data-dir="left"  aria-label="왼쪽: 반대어"></button>
      <button class="br" data-dir="right" aria-label="오른쪽: 유사어"></button>
    </div>

    <button class="rb" id="bB" aria-label="B 버튼: 오늘의 신조어 첫 번째"></button>
    <button class="rb" id="bA" aria-label="A 버튼: 오늘의 신조어 두 번째"></button>
    <div class="rl" style="left:294px;top:487px">B</div>
    <div class="rl" style="left:341px;top:465px">A</div>

    <button class="gb" id="bSel" aria-label="SHARE: 오늘의 신조어 카드를 JPG로 공유"></button>
    <button class="gb" id="bSta" aria-label="MEMO: 메모장 열기·닫기"></button>
    <div class="gl" style="left:141px;top:543px">SHARE</div>
    <div class="gl" style="left:201px;top:537px">MEMO</div>

    <div id="spk" class="abs"><i style="left:0"></i><i style="left:13px"></i><i style="left:26px"></i><i style="left:39px"></i><i style="left:52px"></i><i style="left:65px"></i></div>
  </div>
</div>
<div id="note">신조어는 웹 검색과 AI 요약으로 정리돼요. 뜻은 커뮤니티마다 다를 수 있어요.</div>
<div class="sr" id="sr" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var TZ = 'Asia/Seoul';
  var PALE = '#c9d983', MID = '#8a9f3a', DEEP = '#2f3b0d', INK = '#0b0c18', BASE = '#4a5b15';

  /* ── 날짜·단어 고르기 ── */
  function todayKST() { return new Intl.DateTimeFormat('sv-SE', { timeZone: TZ }).format(new Date()); }
  function dayNumber(s) { var p = s.split('-').map(Number); return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
  // 오늘 날짜가 붙은 단어를 먼저, 모자라면 기본 목록에서 날짜에 따라 돌려 채워 2개를 만듭니다.
  function pickTwo(words, today) {
    var out = words.filter(function (w) { return w.date === today; }).slice(0, 2);
    var pool = words.filter(function (w) { return !w.date; });
    var list = pool.length ? pool : words;
    var n = dayNumber(today), k = 0;
    while (out.length < 2 && k < list.length * 2) {
      var c = list[(n * 2 + k) % list.length];
      if (!out.some(function (o) { return o.word === c.word; })) out.push(c);
      k++;
    }
    return out;
  }

  /* ── 작은 도우미 ── */
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function $(id) { return document.getElementById(id); }
  function domain(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function sprite(rows, color, cls, x, y) {
    var h = rows.length, w = rows[0].length, c = document.createElement('canvas'); c.width = w; c.height = h;
    var g = c.getContext('2d'); g.fillStyle = color;
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) if (rows[j][i] === 'X') g.fillRect(i, j, 1, 1);
    c.className = 'sp ' + (cls || ''); if (x != null) { c.style.left = x + 'px'; c.style.top = y + 'px'; } return c;
  }
  var HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  var HEART_O = ['.XX.XX.', 'X..X..X', 'X.....X', '.X...X.', '..X.X..', '...X...'];
  var ARR = {
    u: ['...X...', '..XXX..', '.XXXXX.', 'XXXXXXX'], d: ['XXXXXXX', '.XXXXX.', '..XXX..', '...X...'],
    l: ['...X', '..XX', '.XXX', 'XXXX', '.XXX', '..XX', '...X'], r: ['X...', 'XX..', 'XXX.', 'XXXX', 'XXX.', 'XX..', 'X...']
  };

  /* ── 패널 만들기 ── */
  var panels = {}; ['c', 'u', 'd', 'l', 'r'].forEach(function (k) { panels[k] = document.querySelector('.panel[data-p="' + k + '"]'); });
  var NAME = { c: '뜻', u: '유래', d: '예문', l: '반대어', r: '유사어' };
  var BACK = { u: 'd', d: 'u', l: 'r', r: 'l' };       // 되돌아가는 방향
  var DIRKEY = { up: 'u', down: 'd', left: 'l', right: 'r' };

  function arrows(p, keys) {   // 갈 수 있는 방향 표시
    var pos = { u: [121, 2], d: [121, 244], l: [2, 121], r: [244, 121] };
    keys.forEach(function (k) { p.appendChild(sprite(ARR[k], PALE, 'blink', pos[k][0], pos[k][1])); });
  }
  function body(p, foot) { var b = el('div', 'pb' + (foot ? ' foot' : '')); var i = el('div', 'inner'); b.appendChild(i); p.appendChild(b); return i; }

  function relList(w, types) {
    return (w.related || []).filter(function (r) { return r && r.word && types.indexOf(r.type) >= 0; });
  }
  function fillRel(p, items, emptyMsg, back) {
    var inner = body(p);
    if (!items.length) {
      var e = el('div', 'empty'); e.appendChild(el('p', 'txt', emptyMsg)); inner.appendChild(e);
    } else items.forEach(function (r) {
      var d = el('div', 'rel'); var h = el('div'); h.appendChild(el('b', r.word.length > 6 ? 'sm' : null, r.word)); h.appendChild(el('span', 'tg', r.type));
      d.appendChild(h); d.appendChild(el('p', 'txt', r.meaning || '')); inner.appendChild(d);
    });
    arrows(p, [back]);
  }

  function render(w) {
    Object.keys(panels).forEach(function (k) { panels[k].textContent = ''; });
    // 가운데: 뜻
    var c = body(panels.c);
    if (w.category) c.appendChild(el('div', 'cat', w.category));
    c.appendChild(el('div', 'word' + (w.word.length > 6 ? ' sm' : ''), w.word));
    c.appendChild(el('p', 'txt', w.meaning));
    arrows(panels.c, ['u', 'd', 'l', 'r']);
    // 위: 유래
    var u = body(panels.u, true); u.appendChild(el('p', 'txt', w.origin || '유래가 아직 정리되지 않았어요.'));
    var dm = domain(w.source); if (dm) panels.u.appendChild(el('div', 'pfoot', '출처 ' + dm));
    arrows(panels.u, ['d']);
    // 아래: 예문
    var d = body(panels.d); var bub = el('div', 'bubble'); bub.appendChild(el('p', 'txt', w.example || '예문이 아직 없어요.')); d.appendChild(bub);
    arrows(panels.d, ['u']);
    // 왼쪽: 반대어, 오른쪽: 유사어
    fillRel(panels.l, relList(w, ['반대 뜻']), '출처에서 확인된 반대어가 아직 없어요.', 'r');
    fillRel(panels.r, relList(w, ['비슷한 뜻', '비슷한 구성']), '출처에서 확인된 유사어가 아직 없어요.', 'l');
    requestAnimationFrame(function () { Object.keys(panels).forEach(function (k) { fit(panels[k].querySelector('.pb')); }); });
  }

  // 긴 글은 자동으로 움직이지 않고, 화면 안에서 손가락·휠로 직접 넘겨 봅니다.
  function fit(b) { if (b) b.scrollTop = 0; }

  /* ── 상태·조작 ── */
  var words = [], today = todayKST(), st = { cur: -1, pos: 'c' }, world = $('world');
  function hearts() {
    var h = $('hearts'); h.textContent = '';
    for (var i = 0; i < 2; i++) h.appendChild(sprite(i === st.cur ? HEART : HEART_O, PALE, '', 0, 0)).style.position = 'static';
  }
  function setPos(k, animate) {
    st.pos = k; var xy = { c: [1, 1], u: [1, 0], d: [1, 2], l: [0, 1], r: [2, 1] }[k];
    world.classList.toggle('anim', !!animate);
    world.style.transform = 'translate(' + (-250 * xy[0]) + 'px,' + (-250 * xy[1]) + 'px)';
    $('label').textContent = NAME[k];
    var p = panels[k]; $('sr').textContent = NAME[k] + ': ' + (p.innerText || p.textContent);
  }
  function pickWord(i) {
    if (!words[i]) return;
    memoOpen(false);
    $('title').style.display = 'none'; $('hud').style.display = 'block'; $('led').classList.add('on');
    if (st.cur !== i) { st.cur = i; render(words[i]); hearts(); }
    setPos('c', false);
  }
  function goHome() {   // 십자키 가운데 버튼: 시작(홈) 화면으로
    memoOpen(false); $('title').style.display = 'block'; $('hud').style.display = 'none'; $('led').classList.remove('on'); setPos('c', false);
    $('sr').textContent = '홈 화면';
  }
  function go(dir) {
    if (st.cur < 0 || memoEl.classList.contains('open')) return; var k = DIRKEY[dir];
    if (st.pos === 'c') setPos(k, true); else if (BACK[st.pos] === k) setPos('c', true);
  }

  /* ── 확대·축소·끌어서 이동 막기 (화면 안 글 스크롤과 버튼만 허용) ── */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }); });
  document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0', '_'].indexOf(e.key) >= 0) e.preventDefault(); });
  document.addEventListener('contextmenu', function (e) { if (e.target !== mta) e.preventDefault(); });

  /* ── 입력: 화면 버튼 + 키보드 ── */
  Array.prototype.forEach.call(document.querySelectorAll('#dpad button'), function (b) {
    var d = $('dpad'), c = 'p' + DIRKEY[b.dataset.dir];
    b.addEventListener('click', function () { go(b.dataset.dir); });
    b.addEventListener('pointerdown', function () { d.classList.add(c); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (e) { b.addEventListener(e, function () { d.classList.remove(c); }); });
  });
  $('bHome').addEventListener('click', goHome);
  $('bB').addEventListener('click', function () { pickWord(0); });
  $('bA').addEventListener('click', function () { pickWord(1); });
  var memoEl = $('memo'), mta = $('mta'), mst = $('mst'), toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; $('sr').textContent = m; clearTimeout(toastT); toastT = setTimeout(function () { t.style.display = 'none'; }, 2200); }

  /* ── 메모장: 입력할 때마다 자동 저장 (이 기기 브라우저에 저장) ── */
  var MK = 'shinjoeo-memo', saveT;
  function memoLoad() { try { mta.value = localStorage.getItem(MK) || ''; } catch (e) {} }
  function memoSave() { clearTimeout(saveT); try { localStorage.setItem(MK, mta.value); mst.textContent = '저장됨'; } catch (e) { mst.textContent = '저장 불가'; } }
  mta.addEventListener('input', function () { mst.textContent = '저장 중…'; clearTimeout(saveT); saveT = setTimeout(memoSave, 350); });
  mta.addEventListener('blur', memoSave);
  window.addEventListener('pagehide', memoSave);
  document.addEventListener('visibilitychange', function () { if (document.hidden) memoSave(); });
  function memoOpen(on) {
    if (on === memoEl.classList.contains('open')) return;
    memoEl.classList.toggle('open', on);
    if (on) { mst.textContent = '자동 저장'; try { mta.focus({ preventScroll: true }); } catch (e) {} } else { memoSave(); mta.blur(); }
  }
  $('bSta').addEventListener('click', function () { memoOpen(!memoEl.classList.contains('open')); });
  memoLoad();

  /* ── 공유: 지금 보는 신조어를 카드 그림(JPG)으로 만들어 다른 앱으로 보냅니다 ── */
  function wrap(g, text, maxW) {
    var lines = [], cur = '';
    String(text || '').split('\n').forEach(function (para) {
      cur = '';
      para.split(' ').forEach(function (tok) {
        var t = cur ? cur + ' ' + tok : tok;
        if (g.measureText(t).width <= maxW) { cur = t; return; }
        if (cur) { lines.push(cur); cur = ''; }
        if (g.measureText(tok).width <= maxW) { cur = tok; return; }
        tok.split('').forEach(function (ch) { if (g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; } else cur += ch; });
      });
      lines.push(cur);
    });
    return lines;
  }
  function cardCanvas(w) {
    var W = 250, X = 14, IW = W - X * 2, K = 4, c = document.createElement('canvas'), g = c.getContext('2d');
    c.width = W * K; c.height = 250 * K;
    function setf(f) { g.font = f; g.textBaseline = 'top'; }
    function layout() {
      var y = 14, o = {};
      if (w.category) { o.catY = y; y += 18; }
      setf("24px Mona12B, 'Noto Sans KR', sans-serif"); o.word = wrap(g, w.word, IW); o.wordY = y; y += o.word.length * 28 + 6;
      setf("12px MonaS10, 'Noto Sans KR', sans-serif"); o.mean = wrap(g, w.meaning, IW); o.meanY = y; y += o.mean.length * 16 + 12;
      if (w.example) { o.ex = wrap(g, w.example, IW - 14); o.exY = y; o.exH = o.ex.length * 16 + 12; y += o.exH + 12; }
      o.footY = y; o.H = Math.max(250, y + 26); return o;
    }
    var o = layout(), H = o.H; c.height = H * K; g = c.getContext('2d'); g.scale(K, K);
    var bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#425213'); bg.addColorStop(1, '#526417'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#8a9f3a'; g.lineWidth = 1; g.strokeRect(5.5, 5.5, W - 11, H - 11);
    function text(arr, x, y, lh) { arr.forEach(function (t, i) { g.fillText(t, x, y + i * lh); }); }
    if (w.category) {
      setf("10px Mona10B, 'Noto Sans KR', sans-serif"); var cw = Math.ceil(g.measureText(w.category).width) + 10;
      g.fillStyle = '#0b0c18'; g.fillRect(X, o.catY + 1, cw + 2, 15); g.fillStyle = PALE; g.fillRect(X + 1, o.catY + 2, cw, 13);
      g.fillStyle = INK; g.fillText(w.category, X + 6, o.catY + 5);
    }
    setf("24px Mona12B, 'Noto Sans KR', sans-serif"); g.fillStyle = INK; text(o.word, X + 1, o.wordY + 1, 28); g.fillStyle = '#eef6c4'; text(o.word, X, o.wordY, 28);
    setf("12px MonaS10, 'Noto Sans KR', sans-serif"); g.fillStyle = PALE; text(o.mean, X, o.meanY, 16);
    if (w.example) {
      g.fillStyle = INK; g.fillRect(X + 2, o.exY + 2, IW, o.exH); g.fillStyle = '#3a4a10'; g.fillRect(X, o.exY, IW, o.exH);
      g.strokeStyle = PALE; g.strokeRect(X + .5, o.exY + .5, IW - 1, o.exH - 1);
      setf("12px MonaS10, 'Noto Sans KR', sans-serif"); g.fillStyle = PALE; text(o.ex, X + 7, o.exY + 6, 16);
    }
    setf("12px MonaS8, monospace"); g.fillStyle = MID; g.fillText('오늘의 신조어 · ' + String(w.date || today).replace(/-/g, '.'), X, H - 24);
    return c;
  }
  var sharing = false;
  function shareCard() {
    var w = words[st.cur >= 0 ? st.cur : 0];
    if (!w) { toast('단어를 불러온 뒤에 눌러 주세요'); return; }
    if (sharing) return; sharing = true;
    var done = function () { sharing = false; };
    try {
      cardCanvas(w).toBlob(function (blob) {
        if (!blob) { toast('카드를 만들지 못했어요'); return done(); }
        var name = 'shinjoeo-' + (w.date || today).replace(/-/g, '') + '-' + w.word.replace(/[^0-9A-Za-z가-힣ㄱ-ㅎ]/g, '') + '.jpg';
        var file; try { file = new File([blob], name, { type: 'image/jpeg' }); } catch (e) { file = null; }
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: '오늘의 신조어: ' + w.word }).then(function () { toast('공유했어요'); }, function (e) { if (!e || e.name !== 'AbortError') toast('공유하지 못했어요'); }).then(done);
        } else {   // 공유를 지원하지 않는 브라우저: JPG 파일로 저장
          var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); toast('JPG로 저장했어요'); done();
        }
      }, 'image/jpeg', .92);
    } catch (e) { toast('카드를 만들지 못했어요'); done(); }
  }
  $('bSel').addEventListener('click', shareCard);
  var KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target === mta) { if (e.key === 'Escape') memoOpen(false); return; }
    if (e.key === 'Escape') { if (memoEl.classList.contains('open')) memoOpen(false); else goHome(); return; }
    if (KEYS[e.key]) { e.preventDefault(); go(KEYS[e.key]); }
    else if (e.key === 'b' || e.key === 'B' || e.key === 'z' || e.key === 'Z') pickWord(0);
    else if (e.key === 'a' || e.key === 'A' || e.key === 'x' || e.key === 'X') pickWord(1);
  });

  /* ── 크기 맞추기: 정수 배율이면 픽셀이 선명합니다 ── */
  function rescale() {
    var w = window.innerWidth - 8, h = window.innerHeight - 50, s = Math.min(Math.floor(w / 394), Math.floor(h / 634));
    if (s < 1) s = Math.min(1, w / 394, h / 634);
    document.documentElement.style.setProperty('--s', Math.max(.5, s));
  }
  window.addEventListener('resize', rescale); rescale();

  /* ── 불러오기 ── */
  function start() {
    $('t2').textContent = today.replace(/-/g, '.');
    fetch('words.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      words = pickTwo(d.words || [], today);
      if (!words.length) throw 0;
    }).catch(function () { $('t3').textContent = '단어를 불러오지 못했어요'; $('t3').classList.remove('blink'); });
  }
  var fl = ['12px Mona12B', '10px Mona10B', '12px MonaS10', '12px MonaS8'].map(function (f) { return document.fonts && document.fonts.load ? document.fonts.load(f, '가나다ABC') : Promise.resolve(); });
  Promise.all(fl).then(start, start);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (st.cur >= 0) Object.keys(panels).forEach(function (k) { fit(panels[k].querySelector('.pb')); }); });

  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
})();
</script>
</body>
